<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👨‍🍳 Burger Party — Cuisine</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1a2e;min-height:100vh;font-family:'Patrick Hand',cursive;color:#fff;padding:10px;}

/* ÉCRAN MOT DE PASSE */
.lock-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;
}
.lock-card{
  background:#16213e;border-radius:16px;border:2px solid #e94560;
  padding:30px 24px;text-align:center;max-width:320px;width:100%;
}
.lock-icon{font-size:3rem;margin-bottom:12px;}
.lock-title{font-family:'Fredoka One',cursive;font-size:1.4rem;color:#fff;margin-bottom:4px;}
.lock-sub{font-size:0.85rem;color:#8892b0;margin-bottom:20px;}
.pin-display{
  display:flex;justify-content:center;gap:10px;margin-bottom:20px;
}
.pin-dot{
  width:16px;height:16px;border-radius:50%;
  border:2px solid #e94560;background:transparent;
  transition:all 0.2s;
}
.pin-dot.filled{background:#e94560;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.pin-btn{
  padding:14px;border:none;border-radius:10px;
  background:#0f3460;color:#fff;
  font-family:'Fredoka One',cursive;font-size:1.3rem;
  cursor:pointer;transition:all 0.15s;
}
.pin-btn:active{transform:scale(0.93);background:#e94560;}
.pin-clear{
  background:#2a0d0d;color:#e94560;border:1px solid #e94560;
  border-radius:10px;padding:10px;width:100%;
  font-family:'Fredoka One',cursive;font-size:0.9rem;
  cursor:pointer;transition:all 0.15s;
}
.pin-error{color:#e94560;font-size:0.85rem;margin-top:8px;min-height:20px;}
.lock-card.shake{animation:shake 0.4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);};}

/* DASHBOARD */
.dashboard{display:none;}

.hdr{background:linear-gradient(135deg,#16213e,#0f3460);border-radius:12px;padding:12px 16px;margin-bottom:12px;border:2px solid #e94560;display:flex;justify-content:space-between;align-items:center;}
.hdr-title{font-family:'Fredoka One',cursive;font-size:1.6rem;color:#fff;letter-spacing:2px;}
.hdr-title span{color:#e94560;}
.hdr-right{display:flex;align-items:center;gap:10px;}
.bell{font-size:1.4rem;cursor:pointer;}
.bell.ring{animation:ring 0.5s ease;}
@keyframes ring{0%{transform:rotate(0);}25%{transform:rotate(15deg);}50%{transform:rotate(-15deg);}75%{transform:rotate(10deg);}100%{transform:rotate(0);}}
.refresh-btn{background:#e94560;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-family:'Fredoka One',cursive;font-size:0.85rem;cursor:pointer;letter-spacing:1px;}
.lock-btn{background:#0f3460;color:#8892b0;border:1px solid #333;border-radius:8px;padding:6px 10px;font-family:'Fredoka One',cursive;font-size:0.8rem;cursor:pointer;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#00ff88;box-shadow:0 0 6px #00ff88;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;};}
.last-refresh{font-size:0.7rem;color:#8892b0;margin-top:2px;}

.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.counter{background:#16213e;border-radius:10px;padding:10px 8px;text-align:center;border:1.5px solid #0f3460;}
.counter .num{font-family:'Fredoka One',cursive;font-size:1.8rem;color:#e94560;}
.counter .lbl{font-size:0.7rem;color:#8892b0;letter-spacing:1px;text-transform:uppercase;}

.counter-status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.cs{border-radius:10px;padding:10px 8px;text-align:center;border:1.5px solid;}
.cs.attente{background:#16213e;border-color:#ffd700;color:#ffd700;}
.cs.encours{background:#16213e;border-color:#ff9f43;color:#ff9f43;}
.cs.pret{background:#16213e;border-color:#00ff88;color:#00ff88;}
.cs .num{font-family:'Fredoka One',cursive;font-size:1.6rem;}
.cs .lbl{font-size:0.7rem;letter-spacing:1px;text-transform:uppercase;opacity:0.8;}

.settings{background:#16213e;border-radius:10px;padding:10px 12px;margin-bottom:12px;border:1.5px solid #0f3460;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.settings span{font-size:0.8rem;color:#ccd6f6;}
.settings input{background:#0f3460;border:1px solid #e94560;border-radius:6px;color:#fff;padding:3px 8px;width:60px;font-family:'Patrick Hand',cursive;font-size:0.9rem;text-align:center;}

.orders-title{font-family:'Fredoka One',cursive;font-size:1rem;color:#8892b0;letter-spacing:2px;margin-bottom:8px;text-transform:uppercase;}
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}

.order-card{border-radius:12px;padding:12px;border:2px solid;position:relative;transition:all 0.3s;}
.order-card.green{background:#0d2818;border-color:#00ff88;}
.order-card.yellow{background:#2a1f00;border-color:#ffd700;}
.order-card.red{background:#2a0d0d;border-color:#e94560;animation:urgent 1s infinite;}
.order-card.done{background:#111;border-color:#333;opacity:0.5;}
@keyframes urgent{0%,100%{box-shadow:0 0 0 #e94560;}50%{box-shadow:0 0 16px #e94560;};}

.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.card-name{font-family:'Fredoka One',cursive;font-size:1.2rem;}
.order-card.green .card-name{color:#00ff88;}
.order-card.yellow .card-name{color:#ffd700;}
.order-card.red .card-name{color:#e94560;}
.order-card.done .card-name{color:#555;}
.card-num{font-size:0.75rem;color:#8892b0;background:#16213e;padding:2px 8px;border-radius:20px;}

.card-details{font-size:0.88rem;color:#ccd6f6;margin-bottom:8px;line-height:1.7;}
.card-details .recette{font-family:'Fredoka One',cursive;font-size:1rem;color:#fff;margin-bottom:2px;}
.card-details .retires{color:#e94560;font-size:0.82rem;}
.card-details .comment{color:#8892b0;font-size:0.8rem;}

.timer-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.timer-bar-bg{flex:1;height:8px;background:#333;border-radius:4px;overflow:hidden;}
.timer-bar{height:100%;border-radius:4px;transition:width 1s linear,background 1s;}
.timer-time{font-family:'Fredoka One',cursive;font-size:0.95rem;min-width:50px;text-align:right;}
.order-card.green .timer-time{color:#00ff88;}
.order-card.yellow .timer-time{color:#ffd700;}
.order-card.red .timer-time{color:#e94560;}
.order-card.done .timer-time{color:#555;}

.status-btns{display:flex;gap:6px;}
.sbtn{flex:1;padding:6px;border:none;border-radius:8px;font-family:'Fredoka One',cursive;font-size:0.75rem;cursor:pointer;transition:all 0.15s;letter-spacing:1px;opacity:0.35;}
.sbtn.active{opacity:1;}
.sbtn.attente{background:#ffd700;color:#000;}
.sbtn.encours{background:#ff9f43;color:#000;}
.sbtn.pret{background:#00ff88;color:#000;}
.sbtn:active{transform:scale(0.95);}

.empty{text-align:center;padding:4rem 1rem;color:#8892b0;}
.empty .big{font-size:4rem;margin-bottom:12px;}
.err-banner{background:#2a0d0d;border:1.5px solid #e94560;border-radius:8px;padding:8px 12px;margin-bottom:10px;color:#e94560;font-size:0.85rem;display:none;}
</style>
</head>
<body>

<!-- ÉCRAN MOT DE PASSE -->
<div class="lock-screen" id="lock-screen">
  <div class="lock-card" id="lock-card">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">Accès Cuisine</div>
    <div class="lock-sub">Entre ton code PIN</div>
    <div class="pin-display">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="addPin('1')">1</button>
      <button class="pin-btn" onclick="addPin('2')">2</button>
      <button class="pin-btn" onclick="addPin('3')">3</button>
      <button class="pin-btn" onclick="addPin('4')">4</button>
      <button class="pin-btn" onclick="addPin('5')">5</button>
      <button class="pin-btn" onclick="addPin('6')">6</button>
      <button class="pin-btn" onclick="addPin('7')">7</button>
      <button class="pin-btn" onclick="addPin('8')">8</button>
      <button class="pin-btn" onclick="addPin('9')">9</button>
      <button class="pin-btn" onclick="addPin('0')" style="grid-column:2;">0</button>
    </div>
    <button class="pin-clear" onclick="clearPin()">⌫ Effacer</button>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

  <div class="hdr">
    <div>
      <div class="hdr-title">👨‍🍳 CUISINE <span>LIVE</span></div>
      <div class="last-refresh" id="last-refresh">Connexion en cours...</div>
    </div>
    <div class="hdr-right">
      <div class="live-dot"></div>
      <span id="bell" class="bell">🔔</span>
      <button class="refresh-btn" onclick="loadOrders()">↻</button>
      <button class="lock-btn" onclick="lockDashboard()">🔒</button>
    </div>
  </div>

  <div class="settings">
    <span>⏱️ Temps cible :</span>
    <input type="number" id="target-time" value="10" min="1" max="60"/>
    <span>min &nbsp;|&nbsp; 🟢 &lt;60% · 🟡 60–90% · 🔴 &gt;90%</span>
  </div>

  <div class="counters">
    <div class="counter"><div class="num" id="cnt-saintnec">0</div><div class="lbl">🧀 St.Nec</div></div>
    <div class="counter"><div class="num" id="cnt-original">0</div><div class="lbl">🍔 Original</div></div>
    <div class="counter"><div class="num" id="cnt-smash">0</div><div class="lbl">💥 Smash</div></div>
    <div class="counter"><div class="num" id="cnt-total">0</div><div class="lbl">📋 Total</div></div>
  </div>

  <div class="counter-status">
    <div class="cs attente"><div class="num" id="cnt-attente">0</div><div class="lbl">⏳ Attente</div></div>
    <div class="cs encours"><div class="num" id="cnt-encours">0</div><div class="lbl">🔥 En cours</div></div>
    <div class="cs pret"><div class="num" id="cnt-pret">0</div><div class="lbl">✅ Prêt</div></div>
  </div>

  <div class="err-banner" id="err-banner">⚠️ Erreur de connexion</div>
  <div class="orders-title">Commandes</div>
  <div class="orders-grid" id="orders-list">
    <div class="empty"><div class="big">👨‍🍳</div><p>En attente de commandes...</p></div>
  </div>

</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycby8AIAOUy7ZfPOF4uxh_UA6BgUTeHGyHXWdQUzZs1qfKhxCRwGYxULgYW5nW5Q_RXeDRw/exec';
const PIN='0410';
let pinEntry='';
let orders=[];
let knownCount=0;
let statuts={};

// PIN
function addPin(d){
  if(pinEntry.length>=4)return;
  pinEntry+=d;
  updateDots();
  if(pinEntry.length===4)checkPin();
}
function clearPin(){
  pinEntry=pinEntry.slice(0,-1);
  updateDots();
  document.getElementById('pin-error').textContent='';
}
function updateDots(){
  for(let i=0;i<4;i++){
    document.getElementById('d'+i).classList.toggle('filled',i<pinEntry.length);
  }
}
function checkPin(){
  if(pinEntry===PIN){
    document.getElementById('lock-screen').style.display='none';
    document.getElementById('dashboard').style.display='block';
    loadOrders();
  } else {
    document.getElementById('pin-error').textContent='Code incorrect, réessaie !';
    document.getElementById('lock-card').classList.add('shake');
    setTimeout(()=>{
      document.getElementById('lock-card').classList.remove('shake');
      pinEntry='';
      updateDots();
    },500);
  }
}
function lockDashboard(){
  pinEntry='';
  updateDots();
  document.getElementById('pin-error').textContent='';
  document.getElementById('dashboard').style.display='none';
  document.getElementById('lock-screen').style.display='flex';
}

// SON
function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [880,660,880].forEach((f,i)=>{
      const o=ctx.createOscillator();
      const g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f;
      g.gain.setValueAtTime(0.3,ctx.currentTime+i*0.15);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.15+0.13);
      o.start(ctx.currentTime+i*0.15);
      o.stop(ctx.currentTime+i*0.15+0.13);
    });
    const bell=document.getElementById('bell');
    bell.classList.add('ring');
    setTimeout(()=>bell.classList.remove('ring'),500);
  }catch(e){}
}

// CHARGEMENT
async function loadOrders(){
  try{
    const resp=await fetch(SCRIPT_URL+'?action=read&t='+Date.now());
    const data=await resp.json();
    document.getElementById('err-banner').style.display='none';
    if(data.rows&&data.rows.length>0){
      const newOrders=data.rows.map((r,i)=>{
        const key=r[0]+'_'+r[1];
        return{id:i,key,horodatage:new Date(r[0]),prenom:r[1]||'?',format:r[2]||'',recette:r[3]||'',cuisson:r[4]||'',retires:r[5]||'',commentaire:r[6]||'',statut:statuts[key]||'attente'};
      });
      if(newOrders.length>knownCount&&knownCount>0)playBeep();
      knownCount=newOrders.length;
      orders=newOrders;
    } else {orders=[];knownCount=0;}
    document.getElementById('last-refresh').textContent='Mis à jour : '+new Date().toLocaleTimeString('fr-FR');
    render();
  }catch(e){
    document.getElementById('err-banner').style.display='block';
    document.getElementById('last-refresh').textContent='⚠️ Erreur — '+new Date().toLocaleTimeString('fr-FR');
  }
}

function setStatus(key,statut){
  statuts[key]=statut;
  orders.find(o=>o.key===key).statut=statut;
  render();
}

function getColor(h,s){
  if(s==='pret')return'done';
  const t=(parseInt(document.getElementById('target-time').value)||10)*60000;
  const p=(Date.now()-h)/t;
  return p>=0.9?'red':p>=0.6?'yellow':'green';
}

function getTimerInfo(h,s){
  const t=(parseInt(document.getElementById('target-time').value)||10)*60000;
  const elapsed=Date.now()-h;
  const pct=Math.min(elapsed/t,1);
  const rem=Math.max(t-elapsed,0);
  const mm=Math.floor(rem/60000).toString().padStart(2,'0');
  const ss=Math.floor((rem%60000)/1000).toString().padStart(2,'0');
  const barColor=pct>=0.9?'#e94560':pct>=0.6?'#ffd700':'#00ff88';
  return{pct,mm,ss,barColor};
}

function render(){
  let saintnec=0,original=0,smash=0,attente=0,encours=0,pret=0;
  orders.forEach(o=>{
    if(o.statut!=='pret'){
      if(o.recette==='Le Saint Nec')saintnec++;else original++;
      if(o.cuisson==='Smash Burger')smash++;
    }
    if(o.statut==='attente')attente++;
    else if(o.statut==='encours')encours++;
    else pret++;
  });
  document.getElementById('cnt-saintnec').textContent=saintnec;
  document.getElementById('cnt-original').textContent=original;
  document.getElementById('cnt-smash').textContent=smash;
  document.getElementById('cnt-total').textContent=orders.length;
  document.getElementById('cnt-attente').textContent=attente;
  document.getElementById('cnt-encours').textContent=encours;
  document.getElementById('cnt-pret').textContent=pret;

  if(orders.length===0){
    document.getElementById('orders-list').innerHTML='<div class="empty"><div class="big">👨‍🍳</div><p>En attente de commandes...</p></div>';
    return;
  }

  const priority={red:0,yellow:1,green:2,done:3};
  const sorted=[...orders].sort((a,b)=>priority[getColor(a.horodatage,a.statut)]-priority[getColor(b.horodatage,b.statut)]);

  document.getElementById('orders-list').innerHTML=sorted.map((o,idx)=>{
    const color=getColor(o.horodatage,o.statut);
    const{pct,mm,ss,barColor}=getTimerInfo(o.horodatage,o.statut);
    const timeDisplay=o.statut==='pret'?'✅ SERVI':mm+':'+ss;
    const barWidth=o.statut==='pret'?100:Math.round(pct*100);
    const emoji=o.recette==='Le Saint Nec'?'🧀':'🍔';
    return`<div class="order-card ${color}">
      <div class="card-top">
        <div class="card-name">${o.prenom}</div>
        <div class="card-num">#${idx+1} · ${o.format}</div>
      </div>
      <div class="card-details">
        <div class="recette">${emoji} ${o.recette} · ${o.cuisson}</div>
        ${o.retires&&o.retires!=='Aucun'?`<div class="retires">⛔ Sans : ${o.retires}</div>`:''}
        ${o.commentaire?`<div class="comment">💬 ${o.commentaire}</div>`:''}
      </div>
      <div class="timer-row">
        <div class="timer-bar-bg"><div class="timer-bar" style="width:${barWidth}%;background:${barColor};"></div></div>
        <div class="timer-time">${timeDisplay}</div>
      </div>
      <div class="status-btns">
        <button class="sbtn attente ${o.statut==='attente'?'active':''}" onclick="setStatus('${o.key}','attente')">⏳ ATTENTE</button>
        <button class="sbtn encours ${o.statut==='encours'?'active':''}" onclick="setStatus('${o.key}','encours')">🔥 EN COURS</button>
        <button class="sbtn pret ${o.statut==='pret'?'active':''}" onclick="setStatus('${o.key}','pret')">✅ PRÊT</button>
      </div>
    </div>`;
  }).join('');
}

setInterval(render,1000);
setInterval(loadOrders,15000);
</script>
</body>
</html>
